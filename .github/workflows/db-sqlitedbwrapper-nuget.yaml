name: NuGet Db.SqliteDbWrapper
run-name: Build for PR ( ${{ github.event.number }} ${{ github.event.pull_request.title }}) by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths: 
      - 'Db/SqliteDbWrapper/**'

jobs:
  deploy-nuget:
    uses: ./.github/workflows/rw-nuget.yaml
    with:
      pckg-name: JosephPKC.Db.SqliteDbWrapper
      sln-path: ./Db/SqliteDbWrapper/SqliteDbWrapper.sln
      proj-path: ./Db/SqliteDbWrapper/SqliteDbWrapper/SqliteDbWrapper.csproj
    secrets: inherit
