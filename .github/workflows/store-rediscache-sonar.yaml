name: SonarQube Store.RedisCache
run-name: Run SonarQube analysis for PR ( ${{ github.event.number }} ${{ github.event.pull_request.title }}) by ${{ github.actor }}

on:
  pull_request:
    types: 
      - opened
      - reopened
      - synchronize
    paths:
      - 'Store/RedisCache/**'
  
jobs:
  sonar-qube-analysis:
    uses: ./.github/workflows/rw-sonar.yaml
    with:
      sln-file-path: ./Store/RedisCache/RedisCache.sln
    secrets: inherit