name: NuGet Logs.LogWrapper
run-name: Build for PR ( ${{ github.event.number }} ${{ github.event.pull_request.title }}) by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths: 
      - 'Logs/LogWrapper/**'

jobs:
  deploy-nuget:
    uses: ./.github/workflows/rw-nuget.yaml
    with:
      pckg-name: JosephPKC.Logs.LogWrapper
      sln-path: ./Logs/LogWrapper/LogWrapper.sln
      proj-path: ./Logs/LogWrapper/LogWrapper/LogWrapper.csproj
    secrets: inherit
